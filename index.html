
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>Sai Kallapalli | Developer Portfolio</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header>

        <a class="mono link" href="mailto:kallapallisai2002@gmail.com">
            Let's talk ↗
        </a>
    </header>


    <!-- MAIN CONTENT -->
    <main>

        <!-- ROTATING WHEEL -->
        <div class="wheel-area">

            <div class="stage">

                <div class="pointer"></div>

                <!-- JavaScript creates wheel labels here -->
                <div class="wheel" id="wheel"></div>

                <!-- Center spin button -->
                <button class="hub mono" id="spin" aria-label="Spin the wheel">
                    
                    <span> Spin ↻</span>
                </button>

            </div>

            <p class="hint mono">
                Click a section · spin · or use ← →
            </p>

        </div>


        <!-- CONTENT PANEL -->
        <section class="panel" aria-live="polite">

            <div class="mono tag">
                <span id="num"></span>
                &nbsp;—&nbsp;
                <span id="tag"></span>
            </div>

            <!-- JavaScript changes this content -->
            <div class="body" id="body"></div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer class="mono">

        <span>© 2026 Sai Kallapalli</span>

    

    </footer>


    <!-- External JavaScript -->
    <script src="script.js"></script>

</body>
</html>
